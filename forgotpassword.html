<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password — Genesis Tech Lab</title>

    <!-- Your existing stylesheet -->
    <link rel="stylesheet" href="css/styles.css">

    <link rel="icon" type="image/png" sizes="32x32" href="assets/images/Logo  png.png">
    <link rel="icon" type="image/png" sizes="16x16" href="assets/images/Logo  png.png">

    <style>
        /* Error animation */

        .error-hidden {
            opacity: 0;
            transform: translateY(-10px);
            pointer-events: none;
        }

        .alert {
            transition: all .35s ease;
        }

        .alert.show {
            opacity: 1;
            transform: translateY(0);
            animation: error-pop .35s ease;
        }

        @keyframes error-pop {
            0% {
                transform: scale(.95);
                opacity: 0;
            }

            60% {
                transform: scale(1.03);
            }

            100% {
                transform: scale(1);
                opacity: 1;
            }
        }
    </style>
</head>

<body>

    <section class="auth-gate">

        <div class="auth-gate-card">

            <div class="auth-gate-icon"><svg xmlns="http://www.w3.org/2000/svg" width="26" height="26"
                    viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="11" width="18" height="11" rx="2" />
                    <path d="M7 11V7a5 5 0 0110 0v4" />
                </svg></div>

            <h2 class="auth-gate-title">Forgot Password</h2>

            <p class="auth-gate-text">
                Enter your registered email address. We'll send a reset link.
            </p>

            <form id="reset-form">

                <div class="form-group">
                    <label class="form-label">Email Address</label>
                    <input type="email" class="form-input" placeholder="Enter your email" required>
                </div>

                <button type="submit" class="btn btn-primary" style="width:100%">
                    Send Reset Link
                </button>

            </form>

            <!-- Error Message -->
            <div id="error-message" class="alert alert-error error-hidden" style="margin-top:20px">
                ⚠ Something went wrong. Please contact GTL Support Team.
            </div>

            <p style="margin-top:20px;font-size:13px;color:var(--text-muted)">
                Remember your password?
                <a href="login.html" style="color:var(--accent)">Login</a>
            </p>

        </div>

    </section>

    <script>
        // Demo trigger (remove when connected to backend)
        document.getElementById("reset-form").addEventListener("submit", function (e) {
            e.preventDefault();

            const err = document.getElementById("error-message");

            err.classList.remove("error-hidden");
            err.classList.add("show");
        });
    </script>

</body>

</html>
